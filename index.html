<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RICETTINE</title>
<style>
:root{--pink:#f8dfe4;--paper:rgba(255,253,251,.95);--ink:#554b49;--muted:#8b817c;--line:#eadbd6;--accent:#c99087;--tag:#f3e3df;--shadow:0 8px 24px rgba(90,67,61,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
body{background:var(--pink);min-height:100vh}.wall{position:fixed;inset:0;z-index:-1;background:var(--pink);background-repeat:repeat;background-position:center top;background-size:1200px 430px}
header,main{width:min(1180px,calc(100% - 40px));margin:auto}header{padding:28px 0 14px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}.logo{font:700 clamp(34px,4vw,54px)/1 "Courier New",monospace;letter-spacing:5px;color:#8d625c;margin:0}.subtitle{margin:5px 0 0;color:var(--muted);font-size:14px}.add{border:0;border-radius:11px;background:var(--accent);color:#fff;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.filter{border:1px solid #dfcec8;background:rgba(255,253,251,.9);padding:8px 14px;border-radius:9px;color:var(--ink);cursor:pointer}.filter.active,.filter:hover{background:var(--tag)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:18px 0}.count{font-size:14px;color:var(--muted)}.search{width:min(310px,100%);padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:rgba(255,253,251,.94);outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:18px;padding-bottom:60px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow);min-height:195px;display:flex;flex-direction:column}.cat{display:inline-block;align-self:flex-start;background:var(--tag);color:#86635d;padding:5px 9px;border-radius:7px;font-size:12px;margin-bottom:10px}.card h3{font-size:22px;margin:0 0 10px}.card p{margin:0;line-height:1.48;white-space:pre-line}.card p+p{margin-top:12px}.actions{margin-top:auto;padding-top:15px;display:flex;gap:8px}.small{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--ink)}.small.del{color:#a45f5a}.empty{grid-column:1/-1;background:rgba(255,253,251,.90);border:1px dashed #d8c8c1;border-radius:16px;text-align:center;padding:45px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(62,50,46,.38);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.panel{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(40,30,25,.2)}.panel h2{margin-top:0}label{display:block;margin:13px 0 6px;font-size:14px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink);font:15px Georgia,serif}textarea{min-height:125px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.form-actions button{border:0;border-radius:9px;padding:10px 15px;cursor:pointer}.cancel{background:#f2ebe7}.save{background:var(--accent);color:#fff}.note{font-size:12px;color:var(--muted);margin-top:12px}
@media(max-width:650px){header,main{width:min(100% - 28px,1180px)}.top{align-items:flex-start}.add{padding:10px 12px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.wall{background-size:900px 360px}}
</style>
</head>
<body>
<div class="wall" id="wall" aria-hidden="true"></div>
<header><div class="top"><div><h1 class="logo">RICETTINE</h1><p class="subtitle">Il piccolo ricettario dei cincillà chef 🥄</p></div><button class="add" id="openAdd">＋ Nuova ricetta</button></div><nav class="filters"><button class="filter active" data-filter="Tutte">Tutte</button><button class="filter" data-filter="Riso">Riso</button><button class="filter" data-filter="Verdurine">Verdurine</button><button class="filter" data-filter="Asia">Asia</button><button class="filter" data-filter="Salsine">Salsine</button><button class="filter" data-filter="Carne">Carne</button></nav></header>
<main><div class="toolbar"><span class="count" id="count"></span><input class="search" id="search" type="search" placeholder="Cerca una ricetta…"></div><section class="grid" id="grid"></section></main>
<div class="modal" id="modal"><div class="panel"><h2 id="modalTitle">Nuova ricetta</h2><form id="recipeForm"><input type="hidden" id="recipeId"><label for="title">Nome della ricetta</label><input id="title" required placeholder="Es. Riso alla cantonese"><label for="category">Tipologia</label><select id="category" required><option>Riso</option><option>Verdurine</option><option>Asia</option><option>Salsine</option><option>Carne</option></select><label for="ingredients">Ingredienti</label><textarea id="ingredients" required placeholder="Un ingrediente per riga…"></textarea><label for="steps">Procedimento</label><textarea id="steps" placeholder="Scrivi qui il procedimento…"></textarea><div class="form-actions"><button type="button" class="cancel" id="closeModal">Annulla</button><button type="submit" class="save">Salva ricetta</button></div><div class="note">Le ricette vengono salvate nel browser.</div></form></div></div>
<script>
const KEY='ricettine-v1';
const initial=[{id:crypto.randomUUID(),title:'Riso alla cantonese',category:'Riso',ingredients:'Riso\nPiselli\nUova\nProsciutto cotto',steps:'Cuoci il riso e prepara gli ingredienti. Salta tutto in padella.'},{id:crypto.randomUUID(),title:'Salsina allo yogurt',category:'Salsine',ingredients:'Yogurt bianco\nLimone\nSale\nErbe aromatiche',steps:'Mescola tutti gli ingredienti e lascia riposare in frigorifero.'}];
let recipes=JSON.parse(localStorage.getItem(KEY)||'null')||initial,currentFilter='Tutte';
const grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),modal=document.getElementById('modal'),form=document.getElementById('recipeForm');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(recipes))}function render(){const q=search.value.trim().toLowerCase();const v=recipes.filter(r=>(currentFilter==='Tutte'||r.category===currentFilter)&&(!q||(r.title+' '+r.ingredients+' '+r.steps).toLowerCase().includes(q)));count.textContent=`${v.length} ${v.length===1?'ricetta':'ricette'}`;grid.innerHTML=v.length?v.map(r=>`<article class="card"><span class="cat">${esc(r.category)}</span><h3>${esc(r.title)}</h3><p><strong>Ingredienti</strong><br>${esc(r.ingredients)}</p>${r.steps?`<p><strong>Procedimento</strong><br>${esc(r.steps)}</p>`:''}<div class="actions"><button class="small" onclick="editRecipe('${r.id}')">Modifica</button><button class="small del" onclick="deleteRecipe('${r.id}')">Elimina</button></div></article>`).join(''):'<div class="empty">Non ci sono ancora ricette in questa categoria.</div>'}
function openNew(){form.reset();recipeId.value='';modalTitle.textContent='Nuova ricetta';modal.classList.add('open');title.focus()}function editRecipe(id){const r=recipes.find(x=>x.id===id);if(!r)return;recipeId.value=r.id;title.value=r.title;category.value=r.category;ingredients.value=r.ingredients;steps.value=r.steps;modalTitle.textContent='Modifica ricetta';modal.classList.add('open')}function deleteRecipe(id){const r=recipes.find(x=>x.id===id);if(r&&confirm(`Eliminare "${r.title}"?`)){recipes=recipes.filter(x=>x.id!==id);save();render()}}
openAdd.onclick=openNew;closeModal.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};search.oninput=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});form.onsubmit=e=>{e.preventDefault();const id=recipeId.value,d={id:id||crypto.randomUUID(),title:title.value.trim(),category:category.value,ingredients:ingredients.value.trim(),steps:steps.value.trim()};recipes=id?recipes.map(r=>r.id===id?d:r):[d,...recipes];save();modal.classList.remove('open');render()};render();

/* Ricostruisce la wallpaper dalla precedente versione del sito: usa un solo cincillà pulito,
   crea la variante grigia via filtro, alterna rigorosamente i colori e disegna cuori vettoriali nitidi. */
(async()=>{try{const old='https://raw.githubusercontent.com/Polentona/Ricettine/7d03b218a98333ad1090cc5a5547c4da98fe1cd4/index.html';const txt=await fetch(old,{cache:'force-cache'}).then(r=>r.text());const m=txt.match(/background-image:url\("(data:image\/(?:png|svg\+xml);base64,[^"]+)"\)/);if(!m)return;const im=new Image();im.src=m[1];await im.decode();const sw=im.naturalWidth,sh=im.naturalHeight;const src=document.createElement('canvas');src.width=sw;src.height=sh;src.getContext('2d').drawImage(im,0,0);const crop=document.createElement('canvas');crop.width=150;crop.height=168;const cc=crop.getContext('2d');cc.clearRect(0,0,150,168);/* prende il cincillà bianco pulito della prima riga */cc.drawImage(src,300,0,150,168,0,0,150,168);const tile=document.createElement('canvas'),S=2;tile.width=1200*S;tile.height=430*S;const c=tile.getContext('2d');c.scale(S,S);c.fillStyle='#f8dfe4';c.fillRect(0,0,1200,430);c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';const xs=[35,335,635,935],ys=[24,235];for(let row=0;row<2;row++){for(let col=0;col<4;col++){const x=xs[col],y=ys[row],gray=(row+col)%2===0;c.save();if(gray)c.filter='grayscale(.58) brightness(.78) contrast(1.06)';c.drawImage(crop,x,y,112,126);c.restore();const hx=x+211,hy=y+57;c.fillStyle='#f6a8b4';c.beginPath();c.moveTo(hx,hy+8);c.bezierCurveTo(hx-14,hy-7,hx-31,hy+10,hx,hy+34);c.bezierCurveTo(hx+31,hy+10,hx+14,hy-7,hx,hy+8);c.fill()}}document.getElementById('wall').style.backgroundImage=`url(${tile.toDataURL('image/png')})`;document.getElementById('wall').style.backgroundSize='1200px 430px'}catch(e){console.warn('Wallpaper fallback rosa',e)}})();
</script>
</body></html>
