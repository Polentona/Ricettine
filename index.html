<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RICETTINE</title>
<style>
:root{--bg:#fce6e7;--paper:#fffdfb;--ink:#514b49;--muted:#8b817c;--line:#ead8d9;--accent:#c98f91;--accent-dark:#8f5e61;--tag:#f4e6e3;--shadow:0 8px 28px rgba(92,75,68,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:var(--bg);overflow-x:hidden}
.chinchilla-wall{position:fixed;inset:0;z-index:-1;pointer-events:none;background-color:var(--bg);background-repeat:repeat;background-position:center top;background-size:1200px 400px;background-image:url("sfondo_cincilla.webp?v=7")}
header{max-width:1200px;margin:0 auto;padding:30px 28px 16px}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{margin:0;font-family:"Courier New",monospace;font-size:clamp(30px,4vw,52px);letter-spacing:5px;font-weight:700;color:#8d625c}.subtitle{color:var(--muted);margin:4px 0 0;font-size:15px}.add-btn{border:0;background:var(--accent);color:white;padding:12px 18px;border-radius:12px;cursor:pointer;font:600 15px Georgia,serif;box-shadow:var(--shadow)}.add-btn:hover{background:#a76f72}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.filter{border:1px solid #dfcec8;background:rgba(255,253,251,.88);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font:14px Georgia,serif}.filter.active,.filter:hover{background:var(--tag);border-color:#cba9a1}
main{max-width:1200px;margin:0 auto;padding:10px 28px 60px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:15px 0 20px}.count{font-size:14px;color:var(--muted)}.search{width:min(300px,100%);padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:rgba(255,253,251,.94);outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.card{background:rgba(255,253,251,.96);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-height:190px;display:flex;flex-direction:column;overflow:hidden}.card-image{width:calc(100% + 40px);height:170px;margin:-20px -20px 16px;object-fit:cover;border-bottom:1px solid var(--line)}.card h3{margin:0 0 8px;font-size:22px}.badges{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.card .category,.draft-badge{display:inline-block;padding:5px 9px;border-radius:7px;font-size:12px}.card .category{background:var(--tag);color:#86635d}.draft-badge{background:#8f5e61;color:white;font-weight:700}.card p{white-space:pre-line;line-height:1.5;margin:0;color:#665e5a}.card-actions{margin-top:auto;padding-top:16px;display:flex;gap:8px;flex-wrap:wrap}.small-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer}.small-btn.publish{background:var(--accent);border-color:var(--accent);color:white}.small-btn.delete{color:#9b5f5a}.empty{grid-column:1/-1;text-align:center;padding:55px 20px;background:rgba(255,253,251,.88);border:1px dashed #d8c8c1;border-radius:16px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(69,57,52,.34);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.panel{width:min(860px,100%);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:18px;padding:25px;box-shadow:0 20px 60px rgba(40,30,25,.2)}.modal-head{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start;margin-bottom:8px}.panel h2{margin:4px 0 0;font-size:30px}.image-upload{height:170px;border:2px dashed #dbc5c2;border-radius:14px;background:#f8eeec;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative;overflow:hidden;color:#8b6e69;transition:.15s}.image-upload:hover,.image-upload.drag{border-color:var(--accent);background:#f5e5e3}.image-upload img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.image-upload.has-image img{display:block}.upload-copy{padding:18px;line-height:1.35}.image-upload.has-image .upload-copy{display:none}.upload-icon{display:block;font-size:28px;margin-bottom:6px}.image-tools{display:flex;justify-content:flex-end;margin-top:6px}.remove-image{display:none;border:0;background:transparent;color:#9b5f5a;cursor:pointer;font:12px Georgia,serif;padding:4px}.image-tools.has-image .remove-image{display:block}label{display:block;font-size:14px;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink);font:15px Georgia,serif}textarea{min-height:130px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;flex-wrap:wrap}.cancel{background:#f2ebe7}.save{background:var(--accent);color:white}.draft-save{background:var(--accent-dark);color:white;font-weight:700}.form-actions button{border:0;border-radius:9px;padding:10px 15px;cursor:pointer}.note{font-size:12px;color:var(--muted);margin-top:12px}
@media(max-width:650px){header,main{padding-left:16px;padding-right:16px}.brand-row{align-items:flex-start}.add-btn{padding:10px 12px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.chinchilla-wall{background-size:900px 300px}.modal-head{grid-template-columns:1fr}.image-upload{height:150px}.panel h2{font-size:26px}.form-actions{justify-content:stretch}.form-actions button{flex:1 1 auto}}
</style>
</head>
<body>
<div class="chinchilla-wall" aria-hidden="true"></div>
<header><div class="brand-row"><div><h1 class="logo">RICETTINE</h1><p class="subtitle">Il piccolo ricettario dei cincillà chef 🥣</p></div><button class="add-btn" id="openAdd">＋ Nuova ricetta</button></div><nav class="filters" aria-label="Filtra per tipologia"><button class="filter active" data-filter="Tutte">Tutte</button><button class="filter" data-filter="Riso">Riso</button><button class="filter" data-filter="Verdurine">Verdurine</button><button class="filter" data-filter="Asia">Asia</button><button class="filter" data-filter="Salsine">Salsine</button><button class="filter" data-filter="Carne">Carne</button></nav></header>
<main><div class="toolbar"><span class="count" id="count"></span><input class="search" id="search" type="search" placeholder="Cerca una ricetta…"></div><section class="grid" id="grid"></section></main>
<div class="modal" id="modal"><div class="panel"><form id="recipeForm"><input type="hidden" id="recipeId"><div class="modal-head"><h2 id="modalTitle">Nuova ricetta</h2><div><div class="image-upload" id="imageUpload" role="button" tabindex="0" aria-label="Carica immagine del piatto"><img id="imagePreview" alt="Anteprima del piatto"><div class="upload-copy"><span class="upload-icon">📷</span><strong>Immagine del piatto</strong><br><small>Clicca o trascina qui una foto</small></div></div><input id="imageInput" type="file" accept="image/*" hidden><div class="image-tools" id="imageTools"><button type="button" class="remove-image" id="removeImage">Rimuovi immagine</button></div></div></div><label for="title">Nome della ricetta</label><input id="title" required placeholder="Es. Riso alla cantonese"><label for="category">Tipologia</label><select id="category" required><option>Riso</option><option>Verdurine</option><option>Asia</option><option>Salsine</option><option>Carne</option></select><label for="ingredients">Ingredienti</label><textarea id="ingredients" required placeholder="Un ingrediente per riga…"></textarea><label for="steps">Procedimento</label><textarea id="steps" placeholder="Scrivi qui il procedimento…"></textarea><div class="form-actions"><button type="button" class="cancel" id="closeModal">Annulla</button><button type="submit" class="save">Salva ricetta</button><button type="button" class="draft-save" id="saveDraft">Salva come bozza</button></div><div class="note">Le ricette e le immagini vengono salvate nel browser tramite memoria locale. Le bozze possono essere modificate o pubblicate in seguito.</div></form></div></div>
<script>
const KEY="ricettine-v1";
const uid=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2);
const initial=[{id:uid(),title:"Riso alla cantonese",category:"Riso",ingredients:"Riso\nPiselli\nUova\nProsciutto cotto",steps:"Cuoci il riso e prepara gli ingredienti. Salta tutto in padella.",image:"",status:"published"},{id:uid(),title:"Salsina allo yogurt",category:"Salsine",ingredients:"Yogurt bianco\nLimone\nSale\nErbe aromatiche",steps:"Mescola tutti gli ingredienti e lascia riposare in frigorifero.",image:"",status:"published"}];
let recipes;try{recipes=JSON.parse(localStorage.getItem(KEY)||"null")||initial}catch(e){recipes=initial}
recipes=recipes.map(r=>({...r,image:r.image||"",status:r.status||"published"}));
let currentFilter="Tutte",pendingImage="";
const grid=document.getElementById("grid"),count=document.getElementById("count"),search=document.getElementById("search"),modal=document.getElementById("modal"),form=document.getElementById("recipeForm"),imageInput=document.getElementById("imageInput"),imageUpload=document.getElementById("imageUpload"),imagePreview=document.getElementById("imagePreview"),imageTools=document.getElementById("imageTools");
function save(){localStorage.setItem(KEY,JSON.stringify(recipes))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function setPreview(src){pendingImage=src||"";imagePreview.src=pendingImage;imageUpload.classList.toggle("has-image",!!pendingImage);imageTools.classList.toggle("has-image",!!pendingImage)}
function render(){const q=search.value.trim().toLowerCase();const visible=recipes.filter(r=>(currentFilter==="Tutte"||r.category===currentFilter)&&(!q||(String(r.title||"")+" "+String(r.ingredients||"")+" "+String(r.steps||"")).toLowerCase().includes(q)));count.textContent=visible.length+" "+(visible.length===1?"ricetta":"ricette");grid.innerHTML=visible.length?visible.map(r=>`<article class="card">${r.image?`<img class="card-image" src="${r.image}" alt="${esc(r.title||"Immagine del piatto")}">`:""}<div class="badges"><span class="category">${esc(r.category)}</span>${r.status==="draft"?'<span class="draft-badge">Bozza</span>':""}</div><h3>${esc(r.title||"Bozza senza titolo")}</h3><p><strong>Ingredienti</strong><br>${esc(r.ingredients||"—")}</p>${r.steps?`<p style="margin-top:12px"><strong>Procedimento</strong><br>${esc(r.steps)}</p>`:""}<div class="card-actions"><button class="small-btn" data-edit="${r.id}">Modifica</button>${r.status==="draft"?`<button class="small-btn publish" data-post="${r.id}">Pubblica</button>`:""}<button class="small-btn delete" data-delete="${r.id}">Elimina</button></div></article>`).join(""):`<div class="empty">Non ci sono ancora ricette in questa categoria.<br><br>Il cincillà chef aspetta nuove idee! 🥣</div>`}
function openNew(){form.reset();document.getElementById("recipeId").value="";document.getElementById("modalTitle").textContent="Nuova ricetta";setPreview("");modal.classList.add("open");document.getElementById("title").focus()}
function editRecipe(id){const r=recipes.find(x=>x.id===id);if(!r)return;document.getElementById("recipeId").value=r.id;document.getElementById("title").value=r.title||"";document.getElementById("category").value=r.category||"Riso";document.getElementById("ingredients").value=r.ingredients||"";document.getElementById("steps").value=r.steps||"";document.getElementById("modalTitle").textContent=r.status==="draft"?"Modifica bozza":"Modifica ricetta";setPreview(r.image||"");modal.classList.add("open")}
function deleteRecipe(id){const r=recipes.find(x=>x.id===id);if(r&&confirm(`Eliminare "${r.title||"questa bozza"}"?`)){recipes=recipes.filter(x=>x.id!==id);save();render()}}
function formData(status){const id=document.getElementById("recipeId").value;return{id:id||uid(),title:document.getElementById("title").value.trim(),category:document.getElementById("category").value,ingredients:document.getElementById("ingredients").value.trim(),steps:document.getElementById("steps").value.trim(),image:pendingImage,status}}
function storeRecipe(data){const exists=recipes.some(r=>r.id===data.id);recipes=exists?recipes.map(r=>r.id===data.id?data:r):[data,...recipes];save();modal.classList.remove("open");render()}
function postRecipe(id){const r=recipes.find(x=>x.id===id);if(!r)return;if(!String(r.title||"").trim()||!String(r.ingredients||"").trim()){editRecipe(id);alert("Per pubblicare la ricetta completa almeno il nome e gli ingredienti.");return}r.status="published";save();render()}
function processImage(file){if(!file||!file.type.startsWith("image/"))return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext("2d");ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.drawImage(img,0,0,canvas.width,canvas.height);setPreview(canvas.toDataURL("image/jpeg",.86))};img.src=reader.result};reader.readAsDataURL(file)}
document.getElementById("openAdd").onclick=openNew;
document.getElementById("closeModal").onclick=()=>modal.classList.remove("open");
document.getElementById("saveDraft").onclick=()=>{const d=formData("draft");if(!d.title)d.title="Bozza senza titolo";storeRecipe(d)};
document.getElementById("removeImage").onclick=()=>{imageInput.value="";setPreview("")};
imageUpload.onclick=()=>imageInput.click();imageUpload.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();imageInput.click()}};imageInput.onchange=e=>processImage(e.target.files[0]);
["dragenter","dragover"].forEach(ev=>imageUpload.addEventListener(ev,e=>{e.preventDefault();imageUpload.classList.add("drag")}));["dragleave","drop"].forEach(ev=>imageUpload.addEventListener(ev,e=>{e.preventDefault();imageUpload.classList.remove("drag")}));imageUpload.addEventListener("drop",e=>processImage(e.dataTransfer.files[0]));
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("open")});search.addEventListener("input",render);document.querySelectorAll(".filter").forEach(btn=>btn.onclick=()=>{currentFilter=btn.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));btn.classList.add("active");render()});grid.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.edit)editRecipe(b.dataset.edit);if(b.dataset.post)postRecipe(b.dataset.post);if(b.dataset.delete)deleteRecipe(b.dataset.delete)});form.addEventListener("submit",e=>{e.preventDefault();storeRecipe(formData("published"))});render();
</script>
</body></html>
