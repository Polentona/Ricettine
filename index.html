isplay:flex;justify-content:space-between;align-items:center;gap:15px;margin:15px 0 20px}.count{font-size:14px;color:var(--muted)}.search{width:min(300px,100%);padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:rgba(255,253,251,.9);outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.card{background:rgba(255,253,251,.94);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-height:190px;display:flex;flex-direction:column}.card h3{margin:0 0 8px;font-size:22px}.card .category{display:inline-block;align-self:flex-start;background:var(--tag);color:#86635d;padding:5px 9px;border-radius:7px;font-size:12px;margin-bottom:12px}.card p{white-space:pre-line;line-height:1.5;margin:0;color:#665e5a}.card-actions{margin-top:auto;padding-top:16px;display:flex;gap:8px}.small-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer}.small-btn.delete{color:#9b5f5a}.empty{grid-column:1/-1;text-align:center;padding:55px 20px;background:rgba(255,253,251,.78);border:1px dashed #d8c8c1;border-radius:16px;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(69,57,52,.34);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.panel{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fffdfb;border-radius:18px;padding:25px;box-shadow:0 20px 60px rgba(40,30,25,.2)}.panel h2{margin-top:0}label{display:block;font-size:14px;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink);font:15px Georgia,serif}textarea{min-height:130px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.cancel{background:#f2ebe7}.save{background:var(--accent);color:#fff;border:0}.form-actions button{border:0;border-radius:9px;padding:10px 15px;cursor:pointer}.note{font-size:12px;color:var(--muted);margin-top:12px}@media(max-width:650px){header,main{padding-left:16px;padding-right:16px}.brand-row{align-items:flex-start}.add-btn{padding:10px 12px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}}</style></head><body><div class="chinchilla-wall" aria-hidden="true"></div><header><div class="brand-row"><div><h1 class="logo">RICETTINE</h1><p class="subtitle">Il piccolo ricettario dei cincillà chef 🥣</p></div><button class="add-btn" id="openAdd">＋ Nuova ricetta</button></div><nav class="filters" aria-label="Filtra per tipologia"><button class="filter active" data-filter="Tutte">Tutte</button><button class="filter" data-filter="Riso">Riso</button><button class="filter" data-filter="Verdurine">Verdurine</button><button class="filter" data-filter="Asia">Asia</button><button class="filter" data-filter="Salsine">Salsine</button><button class="filter" data-filter="Carne">Carne</button></nav></header><main><div class="toolbar"><span class="count" id="count"></span><input class="search" id="search" type="search" placeholder="Cerca una ricetta…"></div><section class="grid" id="grid"></section></main><div class="modal" id="modal"><div class="panel"><h2 id="modalTitle">Nuova ricetta</h2><form id="recipeForm"><input type="hidden" id="recipeId"><label for="title">Nome della ricetta</label><input id="title" required placeholder="Es. Riso alla cantonese"><label for="category">Tipologia</label><select id="category" required><option>Riso</option><option>Verdurine</option><option>Asia</option><option>Salsine</option><option>Carne</option></select><label for="ingredients">Ingredienti</label><textarea id="ingredients" required placeholder="Un ingrediente per riga…"></textarea><label for="steps">Procedimento</label><textarea id="steps" placeholder="Scrivi qui il procedimento…"></textarea><div class="form-actions"><button type="button" class="cancel" id="closeModal">Annulla</button><button type="submit" class="save">Salva ricetta</button></div><div class="note">Le ricette vengono salvate nel browser tramite memoria locale. Non serve un account e non ci sono costi.</div></form></div></div><script>const KEY="ricettine-v1",initial=[{id:crypto.randomUUID(),title:"Riso alla cantonese",category:"Riso",ingredients:"Riso\nPiselli\nUova\nProsciutto cotto",steps:"Cuoci il riso e prepara gli ingredienti. Salta tutto in padella."},{id:crypto.randomUUID(),title:"Salsina allo yogurt",category:"Salsine",ingredients:"Yogurt bianco\nLimone\nSale\nErbe aromatiche",steps:"Mescola tutti gli ingredienti e lascia riposare in frigorifero."}];let recipes=JSON.parse(localStorage.getItem(KEY)||"null")||initial,currentFilter="Tutte";const grid=document.getElementById("grid"),count=document.getElementById("count"),search=document.getElementById("search"),modal=document.getElementById("modal"),form=document.getElementById("recipeForm");function save(){localStorage.setItem(KEY,JSON.stringify(recipes))}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function render(){const q=search.value.trim().toLowerCase(),visible=recipes.filter(r=>(currentFilter==="Tutte"||r.category===currentFilter)&&(!q||(r.title+" "+r.ingredients+" "+r.steps).toLowerCase().includes(q)));count.textContent=`${visible.length} ${visible.length===1?"ricetta":"ricette"}`;grid.innerHTML=visible.length?visible.map(r=>`<article class="card"><span class="category">${esc(r.category)}</span><h3>${esc(r.title)}</h3><p><strong>Ingredienti</strong><br>${esc(r.ingredients)}</p>${r.steps?`<p style="margin-top:12px"><strong>Procedimento</strong><br>${esc(r.steps)}</p>`:""}<div class="card-actions"><button class="small-btn" onclick="editRecipe('${r.id}')">Modifica</button><button class="small-btn delete" onclick="deleteRecipe('${r.id}')">Elimina</button></div></article>`).join(""):`<div class="empty">Non ci sono ancora ricette in questa categoria.<br><br>Il cincillà chef aspetta nuove idee! 🐭👨‍🍳</div>`}function openNew(){form.reset();recipeId.value="";modalTitle.textContent="Nuova ricetta";modal.classList.add("open");title.focus()}function editRecipe(id){const r=recipes.find(x=>x.id===id);if(!r)return;recipeId.value=r.id;title.value=r.title;category.value=r.category;ingredients.value=r.ingredients;steps.value=r.steps;modalTitle.textContent="Modifica ricetta";modal.classList.add("open")}function deleteRecipe(id){const r=recipes.find(x=>x.id===id);if(r&&confirm(`Eliminare "${r.title}"?`)){recipes=recipes.filter(x=>x.id!==id);save();render()}}openAdd.onclick=openNew;closeModal.onclick=()=>modal.classList.remove("open");modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("open")});search.addEventListener("input",render);document.querySelectorAll(".filter").forEach(btn=>btn.onclick=()=>{currentFilter=btn.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));btn.classList.add("active");render()});form.addEventListener("submit",e=>{e.preventDefault();const id=recipeId.value,data={id:id||crypto.randomUUID(),title:title.value.trim(),category:category.value,ingredients:ingredients.value.trim(),steps:steps.value.trim()};recipes=id?recipes.map(r=>r.id===id?data:r):[data,...recipes];save();modal.classList.remove("open");render()});render();</script></body></html>
