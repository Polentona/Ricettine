name: Apply Ricettine HTML

on:
  push:
    branches: [main]
    paths:
      - '_deploy_index.html'
      - '.github/workflows/apply-ricettine.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html
        run: cp _deploy_index.html index.html
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Applica sfondo corretto a RICETTINE"
          git push
