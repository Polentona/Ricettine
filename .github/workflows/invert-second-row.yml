name: Invert second chinchilla row

on:
  push:
    branches: [main]
    paths:
      - 'invert-row.trigger'

permissions:
  contents: write

jobs:
  update-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Invert only the second row colors
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re

          p = Path('sfondo_cincilla.webp')
          im = Image.open(p).convert('RGB')
          if im.size != (1200, 400):
              raise SystemExit(f'Unexpected background size: {im.size}')

          out = im.copy()
          y0, y1 = 200, 400
          white1 = im.crop((0, y0, 200, y1))
          gray1  = im.crop((300, y0, 500, y1))
          white2 = im.crop((600, y0, 800, y1))
          gray2  = im.crop((900, y0, 1100, y1))

          out.paste(gray1,  (0, y0))
          out.paste(white1, (300, y0))
          out.paste(gray2,  (600, y0))
          out.paste(white2, (900, y0))
          out.save(p, 'WEBP', quality=95, method=6)

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'sfondo_cincilla\.webp\?v=\d+', 'sfondo_cincilla.webp?v=7', html)
          index.write_text(html, encoding='utf-8')
          PY
      - name: Commit only background update
        run: |
          rm -f invert-row.trigger
          rm -f .github/workflows/invert-second-row.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Inverte i colori della seconda riga di cincillà"
          git push
