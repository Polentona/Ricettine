name: Cleanup Ricettine temp files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-ricettine-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary deployment files
        run: |
          rm -f background-test.txt _tmp_ricettine_new.html _deploy_index.html _deploy_marker.txt _deploy_note.txt _deploy_ready.txt _deploy_final.txt _deploy_commit.txt _deploy_ok.txt _deploy_pr.txt _deploy_pull.txt _deploy_merge.txt _deploy_one_more.txt
          rm -f .github/workflows/apply-ricettine.yml .github/workflows/cleanup-ricettine-temp.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Pulisce file temporanei di deploy"
          git push
