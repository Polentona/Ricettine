name: Add recipe count banner

on:
  push:
    branches: [main]
    paths:
      - 'count-banner.trigger'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update count style
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          old = '.count{font-size:14px;color:var(--muted)}'
          new = '.count{display:inline-block;font-size:14px;color:var(--muted);background:rgba(255,253,251,.92);border:1px solid var(--line);border-radius:9px;padding:6px 10px;box-shadow:var(--shadow)}'
          if old not in html:
              raise SystemExit('Stile .count atteso non trovato')
          html = html.replace(old, new, 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          rm -f count-banner.trigger
          rm -f .github/workflows/add-count-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiunge banner al conteggio ricette"
          git push
